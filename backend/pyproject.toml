[project]
name = "manual-assist-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "docling==2.119.0",
    "fastapi==0.141.1",
    "lancedb==0.37.1",
    "onnxruntime==1.28.0",
    "openai==3.0.0",
    "optimum[onnxruntime]==2.1.0",
    "pydantic==2.13.4",
    "pypdfium2==5.12.1",
    "python-dotenv==1.2.2",
    "tavily-python==0.7.27",
    "tiktoken==0.13.0",
    "transformers==4.57.6",
    "uvicorn==0.52.3",
]

[dependency-groups]
dev = [
    "ruff==0.16.2",
]

[tool.uv]
package = false
add-bounds = "exact"
